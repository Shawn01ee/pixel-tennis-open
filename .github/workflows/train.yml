# The computer players keep learning: every day they play each other, and what they learned is committed
# back with a fresh build, so the published game always starts from the latest values. Each run also measures what
# the learning is worth and redraws training/README.md.
name: Train players
on:
  schedule:
    - cron: '0 18 * * *'   # daily, 18:00 UTC
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds of self-play (every player meets every other twice a round)
        default: '4'
permissions:
  contents: write
concurrency: train
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-play
        run: node tools/train.js ${{ github.event.inputs.rounds || '4' }}
      - name: Analysis
        run: |
          node tools/analysis/collect.js 2
          node tools/analysis/analyze.js
      - name: Tests
        run: |
          node tests/match-simulation.test.js | tail -1
          node tests/physics-realism.test.js | tail -1
          node tests/score.test.js | tail -1
          node tests/stamina.test.js | tail -1
      - name: Build
        run: python3 build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/players/learned.js dist/pixel-tennis-open.html training
          git diff --cached --quiet || git commit -m "Players trained: $(date -u +%F)"
          git push
