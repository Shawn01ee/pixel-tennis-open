<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Mutual information between each feature and winning the point"><rect width="760" height="482" fill="#fcfcfb"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#0b0b0b">What a shot's situation says about winning the point</text>
<text x="16" y="42" font-size="12" fill="#52514e">Mutual information with "the hitter wins the point", in bits (the outcome itself carries 0.996 bits)</text><line x1="210" x2="210" y1="52" y2="452" stroke="#e4e3df"/><text x="210" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.000</text><line x1="268.19030874492285" x2="268.19030874492285" y1="52" y2="452" stroke="#e4e3df"/><text x="268.19030874492285" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.002</text><line x1="326.3806174898457" x2="326.3806174898457" y1="52" y2="452" stroke="#e4e3df"/><text x="326.3806174898457" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.004</text><line x1="384.5709262347686" x2="384.5709262347686" y1="52" y2="452" stroke="#e4e3df"/><text x="384.5709262347686" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.006</text><line x1="442.76123497969144" x2="442.76123497969144" y1="52" y2="452" stroke="#e4e3df"/><text x="442.76123497969144" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.008</text><line x1="500.9515437246143" x2="500.9515437246143" y1="52" y2="452" stroke="#e4e3df"/><text x="500.9515437246143" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.010</text><line x1="559.1418524695372" x2="559.1418524695372" y1="52" y2="452" stroke="#e4e3df"/><text x="559.1418524695372" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.012</text><line x1="617.33216121446" x2="617.33216121446" y1="52" y2="452" stroke="#e4e3df"/><text x="617.33216121446" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.014</text><line x1="675.5224699593829" x2="675.5224699593829" y1="52" y2="452" stroke="#e4e3df"/><text x="675.5224699593829" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.016</text><text x="200" y="71" text-anchor="end" font-size="13" fill="#0b0b0b">tactic chosen</text><rect x="210" y="59" width="436.4" height="15" rx="3" fill="#2a78d6"><title>tactic chosen: 0.0150 bits</title></rect><text x="652.4" y="71" font-size="12" fill="#0b0b0b">0.0150</text><text x="200" y="93" text-anchor="end" font-size="13" fill="#0b0b0b">power rating</text><rect x="210" y="81" width="417.0" height="15" rx="3" fill="#2a78d6"><title>power rating: 0.0143 bits</title></rect><text x="633.0" y="93" font-size="12" fill="#0b0b0b">0.0143</text><text x="200" y="115" text-anchor="end" font-size="13" fill="#0b0b0b">control rating</text><rect x="210" y="103" width="402.1" height="15" rx="3" fill="#2a78d6"><title>control rating: 0.0138 bits</title></rect><text x="618.1" y="115" font-size="12" fill="#0b0b0b">0.0138</text><text x="200" y="137" text-anchor="end" font-size="13" fill="#0b0b0b">incoming topspin</text><rect x="210" y="125" width="365.6" height="15" rx="3" fill="#2a78d6"><title>incoming topspin: 0.0126 bits</title></rect><text x="581.6" y="137" font-size="12" fill="#0b0b0b">0.0126</text><text x="200" y="159" text-anchor="end" font-size="13" fill="#0b0b0b">shots so far</text><rect x="210" y="147" width="357.2" height="15" rx="3" fill="#2a78d6"><title>shots so far: 0.0123 bits</title></rect><text x="573.2" y="159" font-size="12" fill="#0b0b0b">0.0123</text><text x="200" y="181" text-anchor="end" font-size="13" fill="#0b0b0b">opponent distance from net</text><rect x="210" y="169" width="341.9" height="15" rx="3" fill="#2a78d6"><title>opponent distance from net: 0.0118 bits</title></rect><text x="557.9" y="181" font-size="12" fill="#0b0b0b">0.0118</text><text x="200" y="203" text-anchor="end" font-size="13" fill="#0b0b0b">opponent control rating</text><rect x="210" y="191" width="340.9" height="15" rx="3" fill="#2a78d6"><title>opponent control rating: 0.0117 bits</title></rect><text x="556.9" y="203" font-size="12" fill="#0b0b0b">0.0117</text><text x="200" y="225" text-anchor="end" font-size="13" fill="#0b0b0b">return of serve</text><rect x="210" y="213" width="306.5" height="15" rx="3" fill="#2a78d6"><title>return of serve: 0.0105 bits</title></rect><text x="522.5" y="225" font-s