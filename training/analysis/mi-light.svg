" y="401" text-anchor="end" font-size="13" fill="#0b0b0b">how stretched</text><rect x="210" y="389" width="87.2" height="15" rx="3" fill="#2a78d6"><title>how stretched: 0.0030 bits</title></rect><text x="303.2" y="401" font-size="12" fill="#0b0b0b">0.0030</text><text x="200" y="423" text-anchor="end" font-size="13" fill="#0b0b0b">aim distance from opponent</text><rect x="210" y="411" width="80.6" height="15" rx="3" fill="#2a78d6"><title>aim distance from opponent: 0.0028 bits</title></rect><text x="296.6" y="423" font-size="12" fill="#0b0b0b">0.0028</text><text x="200" y="445" text-anchor="end" font-size="13" fill="#0b0b0b">opponent at the net</text><rect x="210" y="433" width="2.1" height="15" rx="3" fill="#2a78d6"><title>opponent at the net: 0.0001 bits</title></rect><text x="218.1" y="445" font-size="12" fill="#0b0b0b">0.0001</text></svg>
