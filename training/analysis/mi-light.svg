<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Mutual information between each feature and winning the point"><rect width="760" height="482" fill="#fcfcfb"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#0b0b0b">What a shot's situation says about winning the point</text>
<text x="16" y="42" font-size="12" fill="#52514e">Mutual information with "the hitter wins the point", in bits (the outcome itself carries 0.996 bits)</text><line x1="210" x2="210" y1="52" y2="452" stroke="#e4e3df"/><text x="210" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.000</text><line x1="319.14058792950107" x2="319.14058792950107" y1="52" y2="452" stroke="#e4e3df"/><text x="319.14058792950107" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.005</text><line x1="428.28117585900213" x2="428.28117585900213" y1="52" y2="452" stroke="#e4e3df"/><text x="428.28117585900213" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.010</text><line x1="537.4217637885031" x2="537.4217637885031" y1="52" y2="452" stroke="#e4e3df"/><text x="537.4217637885031" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.015</text><line x1="646.5623517180043" x2="646.5623517180043" y1="52" y2="452" stroke="#e4e3df"/><text x="646.5623517180043" y="468" text-anchor="middle" font-size="12" fill="#52514e">0.020</text><text x="200" y="71" text-anchor="end" font-size="13" fill="#0b0b0b">tactic chosen</text><rect x="210" y="59" width="436.4" height="15" rx="3" fill="#2a78d6"><title>tactic chosen: 0.0200 bits</title></rect><text x="652.4" y="71" font-size="12" fill="#0b0b0b">0.0200</text><text x="200" y="93" text-anchor="end" font-size="13" fill="#0b0b0b">shots so far</text><rect x="210" y="81" width="376.7" height="15" rx="3" fill="#2a78d6"><title>shots so far: 0.0173 bits</title></rect><text x="592.7" y="93" font-size="12" fill="#0b0b0b">0.0173</text><text x="200" y="115" text-anchor="end" font-size="13" fill="#0b0b0b">incoming topspin</text><rect x="210" y="103" width="328.9" height="15" rx="3" fill="#2a78d6"><title>incoming topspin: 0.0151 bits</title></rect><text x="544.9" y="115" font-size="12" fill="#0b0b0b">0.0151</text><text x="200" y="137" text-anchor="end" font-size="13" fill="#0b0b0b">opponent distance from net</text><rect x="210" y="125" width="309.9" height="15" rx="3" fill="#2a78d6"><title>opponent distance from net: 0.0142 bits</title></rect><text x="525.9" y="137" font-size="12" fill="#0b0b0b">0.0142</text><text x="200" y="159" text-anchor="end" font-size="13" fill="#0b0b0b">hitter distance from net</text><rect x="210" y="147" width="297.2" height="15" rx="3" fill="#2a78d6"><title>hitter distance from net: 0.0136 bits</title></rect><text x="513.2" y="159" font-size="12" fill="#0b0b0b">0.0136</text><text x="200" y="181" text-anchor="end" font-size="13" fill="#0b0b0b">return of serve</text><rect x="210" y="169" width="275.0" height="15" rx="3" fill="#2a78d6"><title>return of serve: 0.0126 bits</title></rect><text x="491.0" y="181" font-size="12" fill="#0b0b0b">0.0126</text><text x="200" y="203" text-anchor="end" font-size="13" fill="#0b0b0b">incoming pace</text><rect x="210" y="191" width="245.4" height="15" rx="3" fill="#2a78d6"><title>incoming pace: 0.0112 bits</title></rect><text x="461.4" y="203" font-size="12" fill="#0b0b0b">0.0112</text><text x="200" y="225" text-anchor="end" font-size="13" fill="#0b0b0b">control rating</text><rect x="210" y="213" width="235.1" height="15" rx="3" fill="#2a78d6"><title>control rating: 0.0108 bits</title></rect><text x="451.1" y="225" font-size="12" fill="#0b0b0b">0.0108</text><text x="200" y="247" text-anchor="end" font-size="13" fill="#0b0b0b">power rating</text><rect x="210" y="235" width="231.2" height="15" rx="3" fill="#2a78d6"><title>power rating: 0.0106 bits</title></rect><text x="447.2" y="247" font-size="12" fill="#0b0b0b">0.0106</text><text x="200" y="269" text-anchor="end" font-size="13" fill="#0b0b0b">opponent control rating</text><rect x="210" y="257" width="211.0" height="15" rx="3" fill="#2a78d6"><title>opponent control rating: 0.0097 bits</title></rect><text x="427.0" y="269" font-size="12" fill="#0b0b0b">0.0097</text><text x="200" y="291" text-anchor="end" font-size="13" fill="#0b0b0b">stroke</text><rect x="210" y="279" width="204.6" height="15