<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Mutual information between each feature and winning the point"><rect width="760" height="482" fill="#1a1a19"/>
<text x="16" y="24" font-size="16" font-weight="600" fill="#f0efec">What a shot's situation says about winning the point</text>
<text x="16" y="42" font-size="12" fill="#c3c2b7">Mutual information with "the hitter wins the point", in bits (the outcome itself carries 0.993 bits)</text><line x1="210" x2="210" y1="52" y2="452" stroke="#383835"/><text x="210" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.000</text><line x1="282.97245777777135" x2="282.97245777777135" y1="52" y2="452" stroke="#383835"/><text x="282.97245777777135" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.005</text><line x1="355.9449155555427" x2="355.9449155555427" y1="52" y2="452" stroke="#383835"/><text x="355.9449155555427" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.010</text><line x1="428.917373333314" x2="428.917373333314" y1="52" y2="452" stroke="#383835"/><text x="428.917373333314" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.015</text><line x1="501.88983111108536" x2="501.88983111108536" y1="52" y2="452" stroke="#383835"/><text x="501.88983111108536" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.020</text><line x1="574.8622888888567" x2="574.8622888888567" y1="52" y2="452" stroke="#383835"/><text x="574.8622888888567" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.025</text><line x1="647.834746666628" x2="647.834746666628" y1="52" y2="452" stroke="#383835"/><text x="647.834746666628" y="468" text-anchor="middle" font-size="12" fill="#c3c2b7">0.030</text><text x="200" y="71" text-anchor="end" font-size="13" fill="#f0efec">tactic chosen</text><rect x="210" y="59" width="436.4" height="15" rx="3" fill="#3987e5"><title>tactic chosen: 0.0299 bits</title></rect><text x="652.4" y="71" font-size="12" fill="#f0efec">0.0299</text><text x="200" y="93" text-anchor="end" font-size="13" fill="#f0efec">hitter distance from net</text><rect x="210" y="81" width="288.4" height="15" rx="3" fill="#3987e5"><title>hitter distance from net: 0.0198 bits</title></rect><text x="504.4" y="93" font-size="12" fill="#f0efec">0.0198</text><text x="200" y="115" text-anchor="end" font-size="13" fill="#f0efec">stroke</text><rect x="210" y="103" width="265.3" height="15" rx="3" fill="#3987e5"><title>stroke: 0.0182 bits</title></rect><text x="481.3" y="115" font-size="12" fill="#f0efec">0.0182</text><text x="200" y="137" text-anchor="end" font-size="13" fill="#f0efec">opponent distance from net</text><rect x="210" y="125" width="244.2" height="15" rx="3" fill="#3987e5"><title>opponent distance from net: 0.0167 bits</title></rect><text x="460.2" y="137" font-size="12" fill="#f0efec">0.0167</text><text x="200" y="159" text-anchor="end" font-size="13" fill="#f0efec">shots so far</text><rect x="210" y="147" width="240.1" height="15" rx="3" fill="#3987e5"><title>shots so far: 0.0165 bits</title></rect><text x="456.1" y="159" font-size="12" fill="#f0efec">0.0165</text><text x="200" y="181" text-anchor="end" font-size="13" fill="#f0efec">incoming topspin</text><rect x="210" y="169" width="234.6" height="15" rx="3" fill="#3987e5"><title>incoming topspin: 0.0161 bits</title></rect><text x="450.6" y="181" font-size="12" fill="#f0efec">0.0161</text><text x="200" y="203" text-anchor="end" font-size="13" fill="#f0efec">return of serve</text><rect x="210" y="191" width="179.9" height="15" rx="3" fill="#3987e5"><title>return of serve: 0.0123 bits</title></rect><text x="395.9" y="203" font-size="12" fill="#f0efec">0.0123</text><text x="200" y="225" text-anchor="end" font-size="13" fill="#f0efec">incoming pace</text><rect x="210" y="213" width="124.6" height="15" rx="3" fill="#3987e5"><title>incoming pace: 0.0085 bits</title></rect><text x="340.6" y="225" font-size="12" fill="#f0efec">0.0085</text><text x="200" y="247" text-anchor="end" font-size="13" fill="#f0efec">aim distance from opponent</text><rect x="210" y="235" width="56.5" height="15" rx="3" fill="#3987e5"><title>aim distance from opponent: 0.0039 bits</title></rect><text x="272.5" y="247" font-size="12" fill="#f0efec">0.0039</text><text x="200" y="269" text-anchor="end" font-si